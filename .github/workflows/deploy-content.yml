# Path A: build content-service → push GHCR → trigger Render deploy hook.
#
# After the first successful push, the GHCR package appears under GitHub → Packages.
# For a private repo you can then set that package Public so Render can pull without
# registry credentials (optional), or keep it private and add GHCR creds on Render.
#
# Required GitHub secret (after creating the Render service + deploy hook):
#   RENDER_CONTENT_DEPLOY_HOOK

name: Deploy content-service

on:
  push:
    branches: [main]
    paths:
      - "backend/content-service/**"
      - ".github/workflows/deploy-content.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/yetbota-content

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/content-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend/content-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render deploy
        env:
          RENDER_CONTENT_DEPLOY_HOOK: ${{ secrets.RENDER_CONTENT_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_CONTENT_DEPLOY_HOOK" ]; then
            echo "RENDER_CONTENT_DEPLOY_HOOK secret not set — image was pushed; skip Render trigger."
            exit 0
          fi
          echo "Triggering Render deploy hook..."
          curl -fsS -X POST "$RENDER_CONTENT_DEPLOY_HOOK"
          echo "Deploy hook accepted."
