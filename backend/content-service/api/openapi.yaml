openapi: 3.0.3
info:
  title: YetBota Content Service
  description: Posts (with place title), Q&A, media, reactions, comments, bookmarks, share, search, feed, and trending.
  version: 0.4.0
servers:
  - url: /
    description: Current host
  - url: http://localhost:8082
    description: Local
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      tags: [Health]
      summary: Liveness
      security: []
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: ok
  /media/sign:
    post:
      tags: [Media]
      summary: Sign a Cloudinary upload
      operationId: signMedia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind:
                  type: string
                  enum: [image, video, audio]
      responses:
        "200":
          description: Signed upload params
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignMediaResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /posts:
    post:
      tags: [Posts]
      summary: Create a post
      operationId: createPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostRequest"
      responses:
        "200":
          description: Created post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /posts/search:
    get:
      tags: [Posts]
      summary: Search posts
      operationId: searchPosts
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/ListCursor"
      responses:
        "200":
          description: Matching posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostsPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /feed:
    get:
      tags: [Feed]
      summary: Home feed
      description: |
        Ranked feed (HN-style gravity; no ML). Following posts when available; otherwise
        recent site-wide posts. Optional `lat`/`lng` (both or neither): when set, nearby
        posts are mixed in and distance boosts ranking.
      operationId: getFeed
      parameters:
        - name: lat
          in: query
          required: false
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: lng
          in: query
          required: false
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/ListCursor"
      responses:
        "200":
          description: Ranked posts page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostsPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /posts/trending:
    get:
      tags: [Trending]
      summary: Trending posts
      description: |
        Recent posts ranked with the feed HN-style formula (engagement ÷ age gravity),
        without follow or geo boosts. Default lookback 7 days.
      operationId: listTrendingPosts
      parameters:
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/ListCursor"
      responses:
        "200":
          description: Ranked posts page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostsPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /creators/trending:
    get:
      tags: [Trending]
      summary: Trending creators
      description: |
        Authors ranked by recent `post_interaction_events` using reputation weights
        and freshness. Returns `user_id` + display `score`; hydrate profiles via identity.
        Top-N only (no cursor). Default lookback 7 days.
      operationId: listTrendingCreators
      parameters:
        - $ref: "#/components/parameters/ListLimit"
      responses:
        "200":
          description: Ranked creators
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrendingCreatorsPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /posts/{id}:
    get:
      tags: [Posts]
      summary: Get a post
      operationId: getPost
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Posts]
      summary: Edit a post
      description: |
        Author-only. Partial update: omit fields to leave unchanged.
        Send `hashtags: []` to clear tags. To replace media, send both `media_mode` and `media`.
      operationId: updatePost
      parameters:
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePostRequest"
      responses:
        "200":
          description: Updated post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /posts/{id}/related:
    get:
      tags: [Posts]
      summary: Related posts (search matches, then similar)
      description: |
        Not the home feed. When `q` is set (e.g. opened from search), returns other
        posts matching that query first; after those are exhausted, returns posts
        similar to the seed via Surreal cosine `similar` edges (FTS fallback when
        the graph has no neighbors). Without `q`, only similar.
      operationId: listRelatedPosts
      parameters:
        - $ref: "#/components/parameters/PostId"
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Original search query when navigating from search results
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/ListCursor"
      responses:
        "200":
          description: Related posts page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelatedPostsPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /posts/{id}/reaction:
    post:
      tags: [Posts]
      summary: Set or clear reaction
      operationId: setReaction
      parameters:
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reaction:
                  type: string
                  nullable: true
                  enum: [like, dislike]
                  description: Omit or null to clear
      responses:
        "200":
          description: Updated post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /posts/{id}/comments:
    post:
      tags: [Posts]
      summary: Add a comment or reply
      operationId: addComment
      parameters:
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  maxLength: 2000
                parent_id:
                  type: string
                  format: uuid
                  description: Top-level comment id to reply to (omit for top-level)
      responses:
        "200":
          description: Comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      tags: [Posts]
      summary: List top-level comments
      operationId: listComments
      parameters:
        - $ref: "#/components/parameters/PostId"
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/ListCursor"
      responses:
        "200":
          description: Top-level comments newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentsPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /comments/{id}/replies:
    get:
      tags: [Posts]
      summary: List replies to a comment
      operationId: listReplies
      parameters:
        - $ref: "#/components/parameters/CommentId"
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/ListCursor"
      responses:
        "200":
          description: Direct replies newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentsPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /comments/{id}/reaction:
    post:
      tags: [Posts]
      summary: Set or clear a comment reaction
      operationId: setCommentReaction
      parameters:
        - $ref: "#/components/parameters/CommentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reaction:
                  type: string
                  nullable: true
                  enum: [like, dislike]
                  description: Omit or null to clear
      responses:
        "200":
          description: Updated comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /posts/{id}/bookmark:
    post:
      tags: [Posts]
      summary: Bookmark a post
      operationId: addBookmark
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Updated post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Posts]
      summary: Remove bookmark
      operationId: removeBookmark
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Updated post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /posts/{id}/share:
    post:
      tags: [Posts]
      summary: Share a post
      operationId: sharePost
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Share URL and updated counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /users/{id}/posts:
    get:
      tags: [Posts]
      summary: List a user's posts
      operationId: listUserPosts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/ListCursor"
      responses:
        "200":
          description: Posts newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostsPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/bookmarks:
    get:
      tags: [Posts]
      summary: List the caller's bookmarks
      operationId: listMyBookmarks
      parameters:
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/ListCursor"
      responses:
        "200":
          description: Bookmarked posts, most recently bookmarked first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostsPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /hashtags/{tag}/posts:
    get:
      tags: [Posts]
      summary: List posts for a hashtag
      operationId: listHashtagPosts
      parameters:
        - name: tag
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/ListCursor"
      responses:
        "200":
          description: Posts with that hashtag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostsPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /questions:
    post:
      tags: [Q&A]
      summary: Ask a question
      description: |
        Ask with a single `body`. Optional `post_id` links to a post.
        Optional `lat`/`lng` (both or neither) attach a place location the same way
        posts do (map pick / place coords), not only the device’s current GPS.
      operationId: createQuestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuestionRequest"
      responses:
        "200":
          description: Created question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      tags: [Q&A]
      summary: List questions
      operationId: listQuestions
      parameters:
        - name: post_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: When set, only questions linked to that post
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/ListCursor"
      responses:
        "200":
          description: Questions page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionsPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /questions/{id}:
    get:
      tags: [Q&A]
      summary: Get a question
      operationId: getQuestion
      parameters:
        - $ref: "#/components/parameters/QuestionId"
      responses:
        "200":
          description: Question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Q&A]
      summary: Edit a question
      description: |
        Author-only. Closed questions cannot be edited.
        Omit fields to leave unchanged. `post_id: ""` clears the post link.
        `clear_place: true` clears lat/lng. To set place, send both lat and lng.
      operationId: updateQuestion
      parameters:
        - $ref: "#/components/parameters/QuestionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateQuestionRequest"
      responses:
        "200":
          description: Updated question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /questions/{id}/close:
    post:
      tags: [Q&A]
      summary: Close a question
      description: Author only. Closed questions reject new answers; votes still allowed.
      operationId: closeQuestion
      parameters:
        - $ref: "#/components/parameters/QuestionId"
      responses:
        "200":
          description: Closed question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /questions/{id}/vote:
    post:
      tags: [Q&A]
      summary: Vote on a question
      description: Authors cannot vote on their own question.
      operationId: voteQuestion
      parameters:
        - $ref: "#/components/parameters/QuestionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoteRequest"
      responses:
        "200":
          description: Updated question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /questions/{id}/answers:
    post:
      tags: [Q&A]
      summary: Answer a question
      description: Rejected if the question is closed.
      operationId: createAnswer
      parameters:
        - $ref: "#/components/parameters/QuestionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  maxLength: 10000
      responses:
        "200":
          description: Created answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Answer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      tags: [Q&A]
      summary: List answers
      operationId: listAnswers
      parameters:
        - $ref: "#/components/parameters/QuestionId"
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/ListCursor"
      responses:
        "200":
          description: Answers page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswersPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /answers/{id}:
    patch:
      tags: [Q&A]
      summary: Edit an answer
      description: Author-only. Updates the answer body.
      operationId: updateAnswer
      parameters:
        - $ref: "#/components/parameters/AnswerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAnswerRequest"
      responses:
        "200":
          description: Updated answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Answer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /answers/{id}/vote:
    post:
      tags: [Q&A]
      summary: Vote on an answer
      description: Authors cannot vote on their own answer.
      operationId: voteAnswer
      parameters:
        - $ref: "#/components/parameters/AnswerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoteRequest"
      responses:
        "200":
          description: Updated answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Answer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /places:
    get:
      tags: [Places]
      summary: List / search place directory
      security: [{ bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: lat
          in: query
          schema: { type: number }
        - name: lng
          in: query
          schema: { type: number }
        - name: radius_m
          in: query
          schema: { type: number }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Places page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlacesPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /places/{id}:
    get:
      tags: [Places]
      summary: Get a place
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Place detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Place"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /places/{id}/posts:
    get:
      tags: [Places]
      summary: List posts for a place
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Posts page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostsPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /places/{id}/entries:
    get:
      tags: [Places]
      summary: List tip / change / important entries
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
        - name: category
          in: query
          schema:
            type: string
            enum: [tip, change, important]
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Entries page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceEntriesPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Identity access token (validated via introspect)
  parameters:
    PostId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuestionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AnswerId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ListLimit:
      name: limit
      in: query
      required: false
      description: Page size (default 20, max 50)
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    ListCursor:
      name: cursor
      in: query
      required: false
      description: Opaque keyset cursor from a previous next_cursor
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    SignMediaResponse:
      type: object
      required: [cloud_name, api_key, timestamp, signature, folder, public_id, resource_type, max_file_size, max_upload_bytes]
      properties:
        cloud_name:
          type: string
        api_key:
          type: string
        timestamp:
          type: integer
          format: int64
        signature:
          type: string
        folder:
          type: string
        public_id:
          type: string
        resource_type:
          type: string
          enum: [image, video]
        max_file_size:
          type: integer
          format: int64
          description: Server upload limit in bytes (echo). Not a Cloudinary signed form field. Default 10485760 (10 MiB).
        max_upload_bytes:
          type: integer
          format: int64
          description: Same as max_file_size; for client-side UI checks before upload. Do not send to Cloudinary.
    CreatePostRequest:
      type: object
      required: [title, lat, lng, media_mode, media]
      properties:
        title:
          type: string
