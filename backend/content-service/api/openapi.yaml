          maxLength: 200
        caption:
          type: string
        lat:
          type: number
        lng:
          type: number
        media_mode:
          type: string
          enum: [images, images_audio, video]
        media:
          type: array
          items:
            $ref: "#/components/schemas/CreateMedia"
        hashtags:
          type: array
          items:
            type: string
    UpdatePostRequest:
      type: object
