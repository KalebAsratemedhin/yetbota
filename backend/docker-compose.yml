name: yetbota

services:
  postgres:
    image: postgres:16
    container_name: yetbota-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yetbota
    ports:
      - "5433:5432"
    volumes:
      - yetbota_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yetbota"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Shared graph DB: identity writes follows; other services may read.
  surrealdb:
    image: surrealdb/surrealdb:v2.3.7
    container_name: yetbota-surreal
    user: root
    command: start --log info --user root --pass root file:/data/database.db
    ports:
      - "8000:8000"
    volumes:
      - yetbota_surreal:/data
    healthcheck:
      test: ["CMD", "/surreal", "isready"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: yetbota-rabbit
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: yetbota
      RABBITMQ_DEFAULT_PASS: yetbota
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Browser UI for Postgres (system: PostgreSQL, server: postgres, user/pass/db: postgres/postgres/yetbota)
  adminer:
    image: adminer:4
    container_name: yetbota-adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  yetbota_pgdata:
  yetbota_surreal:
