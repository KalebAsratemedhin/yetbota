# Hot reload for identity-service — used by `make identity` / `make run`
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/identity-service ./cmd/"
  bin = "./tmp/identity-service"
  include_ext = ["go", "yaml", "yml", "sql"]
  include_file = [".env"]
  exclude_dir = ["tmp", "vendor"]
  exclude_regex = ["_test\\.go"]
  delay = 800
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true
