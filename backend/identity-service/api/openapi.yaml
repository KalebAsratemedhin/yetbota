openapi: 3.0.3
info:
  title: YetBota Identity Service
  description: Auth, profile, follow graph, user search, avatar upload (Cloudinary), and reputation/badges.
  version: 0.6.0
servers:
  - url: /
    description: Current host (local or Render)
  - url: http://localhost:8081
    description: Local (only when Swagger is also opened on localhost)
paths:
  /auth/signup:
    post:
      tags: [Auth]
      summary: Sign up
      operationId: signUp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Username taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/signin:
    post:
      tags: [Auth]
      summary: Sign in
      operationId: signIn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh tokens
      description: Exchange a refresh token for a new access + refresh pair (old refresh revoked).
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/me:
    get:
      tags: [Profile]
      summary: Get profile
      operationId: me
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Profile]
      summary: Update profile
      operationId: updateProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Auth]
      summary: Delete account
      operationId: deleteAccount
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOK"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/me/avatar:
    post:
      tags: [Profile]
      summary: Upload avatar
      description: Multipart form field `file` (jpeg/png/webp/gif, max 2MB). Stored on Cloudinary.
      operationId: uploadAvatar
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Profile]
      summary: Delete avatar
      operationId: deleteAvatar
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/introspect:
    post:
      tags: [Auth]
      summary: Introspect access token
      operationId: introspect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntrospectRequest"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntrospectResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out
      description: Revokes current access token and the given refresh token.
      operationId: logout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/password:
    post:
      tags: [Auth]
      summary: Change password
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/search:
    get:
      tags: [Social]
      summary: Search users
      description: Case-insensitive match on username and full name. Min query length 2; max 20 results. Excludes the caller.
      operationId: searchUsers
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Users"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/{id}:
    get:
      tags: [Social]
      summary: Get public profile
      operationId: getUserProfile
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Public profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /users/{id}/follow:
    post:
      tags: [Social]
      summary: Follow user
      operationId: followUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Followed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Social]
      summary: Unfollow user
      operationId: unfollowUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Unfollowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/{id}/followers:
    get:
      tags: [Social]
      summary: List followers
      description: |
        Returns public profiles for users who follow `{id}`, newest follows first.
        Keyset pagination via `cursor` / `next_cursor`. Hydrated from Postgres in one batch
        after reading follow edges from SurrealDB.
      operationId: listFollowers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/ListCursor"
      responses:
        "200":
          description: Follower profiles page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /users/{id}/following:
    get:
      tags: [Social]
      summary: List following
      description: |
        Returns public profiles for users `{id}` follows, newest follows first.
        Same pagination and hydration model as followers.
      operationId: listFollowing
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/ListCursor"
      responses:
        "200":
          description: Following profiles page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /internal/reputation/events:
    post:
      tags: [Internal]
      summary: Record a legacy reputation event (service-to-service)
      description: |
        Legacy fixed-delta path. Prefer `POST /internal/reputation/score` for
        engagement-weighted sync from content-service.
      operationId: recordReputationEvent
      security: []
      parameters:
        - name: X-Service-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, event_type, subject_type]
              properties:
                user_id:
                  type: string
                  format: uuid
                actor_id:
                  type: string
                  format: uuid
                event_type:
                  type: string
                  enum: [post.created, post.liked, post.unliked]
                subject_type:
                  type: string
                  example: post
                subject_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Updated snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReputationSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /internal/reputation/score:
    post:
      tags: [Internal]
      summary: Sync engagement-weighted reputation score
      description: |
        Content recomputes R(u) from post engagement + gravity and sets the
        denormalized score. Also drives badge awards from posts_created / likes_received.
      operationId: syncReputationScore
      security: []
      parameters:
        - name: X-Service-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, score]
              properties:
                user_id:
                  type: string
                  format: uuid
                score:
                  type: integer
                  format: int64
                  minimum: 0
                posts_created:
                  type: integer
                  format: int64
                likes_received:
                  type: integer
                  format: int64
      responses:
        "200":
          description: Updated snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReputationSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /healthz:
    get:
      tags: [Ops]
      summary: Health check
      operationId: healthz
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: ok
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token (not refresh)
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ListLimit:
      name: limit
      in: query
      required: false
      description: Page size (default 20, max 50)
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    ListCursor:
      name: cursor
      in: query
      required: false
      description: Opaque keyset cursor from a previous `next_cursor`
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Credentials:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        full_name:
          type: string
          description: Required for signup; ignored for sign-in
    SignUpRequest:
      type: object
      required: [username, password, full_name]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        full_name:
          type: string
    AuthResponse:
      type: object
      required: [user_id, username, access_token, refresh_token]
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
        access_token:
          type: string
        refresh_token:
          type: string
    UserInfo:
      type: object
      required:
        [
          user_id,
          username,
          full_name,
          phone,
          address,
          bio,
          avatar_url,
          reputation_score,
          reputation_level,
          badges,
        ]
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
        full_name:
          type: string
        phone:
          type: string
        address:
          type: string
        bio:
          type: string
        avatar_url:
          type: string
          description: Empty when no avatar
        reputation_score:
          type: integer
          format: int64
        reputation_level:
          type: string
          description: "Explorer (<100) | Contributor (≥100) | Local Guide (≥400) | Pathfinder (≥1000)"
          example: Explorer
        badges:
          type: array
          items:
            $ref: "#/components/schemas/Badge"
    ReputationSnapshot:
      type: object
      required: [reputation_score, reputation_level, badges]
      properties:
        reputation_score:
          type: integer
          format: int64
        reputation_level:
          type: string
        badges:
          type: array
          items:
            $ref: "#/components/schemas/Badge"
    Badge:
      type: object
      required: [id, name, description]
      properties:
        id:
          type: string
          example: first_post
        name:
          type: string
        description:
          type: string
        awarded_at:
          type: string
          format: date-time
          description: Present when the badge has been awarded to the user
    Users:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/UserInfo"
    UsersPage:
      type: object
      required: [users, total]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/UserInfo"
        next_cursor:
          type: string
          description: Pass as `cursor` for the next page; omitted when no more results
        total:
          type: integer
          format: int64
          description: Total follow edges for this list (not just the page)
    UpdateProfileRequest:
      type: object
      description: Send any subset of fields to update
      properties:
        full_name:
          type: string
        phone:
          type: string
          description: Optional; if non-empty, length 7–15
        address:
          type: string
        bio:
          type: string
    IntrospectRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Access token
    IntrospectResponse:
      type: object
      required: [active]
      properties:
        active:
          type: boolean
        user_id:
          type: string
          format: uuid
        username:
          type: string
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    LogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
    StatusOK:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code
              enum:
                - VALIDATION_FAILED
                - USERNAME_TAKEN
                - INVALID_CREDENTIALS
                - UNAUTHORIZED
                - NOT_FOUND
                - INTERNAL_ERROR
            message:
              type: string
            details:
              type: array
              items:
                type: object
                required: [field, code, message]
                properties:
                  field:
                    type: string
                  code:
                    type: string
                  message:
                    type: string
